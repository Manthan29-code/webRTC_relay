name: Keep Render service alive

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron cannot run more often than every 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping service every 10 seconds
        env:
          SERVICE_URL: https://webrtc-relay.onrender.com/health
        run: |
          end_time=$((SECONDS + 270))
          while [ "$SECONDS" -lt "$end_time" ]; do
            timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            if curl --fail --silent --show-error --max-time 20 "$SERVICE_URL" > /dev/null; then
              echo "$timestamp - service is reachable"
            else
              echo "$timestamp - service request failed" >&2
            fi
            sleep 10
          done
